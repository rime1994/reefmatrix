version: "3.9"

# 开发模式：只启动 PostgreSQL，前后端分别本地运行（热重载）
# 用法：docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reefmatrix
      POSTGRES_PASSWORD: reefmatrix_dev
      POSTGRES_DB: reefmatrix
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d  # 首次自动建表

volumes:
  postgres_dev_data:
